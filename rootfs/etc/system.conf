# /etc/system.conf: the whole system, declared. Edit it, then run
#
#     pkg switch          build a new generation and switch to it
#     pkg switch -n       only show what would change
#     pkg rollback        go back to the previous generation
#
# `pkg add NAME` and `pkg remove NAME` edit the packages line for you.
# See /usr/share/huldra/docs/packages.md.

# Package repositories (binary caches), tried in order. The default is the
# build machine as seen from QEMU (`cargo xtask run` serves target/repo).
repo = http://10.0.2.2:8800

# Packages in the system profile (/pkg/system/sw), with their
# dependencies. NAME, NAME@VERSION (pinned) or a path to a .pkg file.
packages =

# The host name (managed /etc/hostname).
#hostname = huldra

# Files under /etc: a [etc/NAME] line, then the contents up to the next
# [etc/...] line. They become links into the generation, so they change
# and roll back together with everything else.
#
#[etc/motd]
#Welcome to Huldra.
