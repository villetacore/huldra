[workspace]
resolver = "2"
members = ["kernel", "xtask", "libs/*", "user"]
# `cargo build` / `cargo test` at the root only touch host crates;
# bare-metal crates are built by `cargo xtask`.
default-members = ["xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/villetacore/huldra"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true

# User programs: small and fast, built by `cargo xtask` with `--profile user`.
[profile.user]
inherits = "release"
opt-level = "s"
debug = false
lto = true
