name: Feature request
description: An idea for Huldra
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could it work?
      description: A sketch is enough. Mention what Linux, BSD or NixOS do, if relevant.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
